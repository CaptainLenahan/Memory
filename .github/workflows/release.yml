# Pushing a tag like v1.2.3 (scripts/release.ps1 does it) builds the Windows installer and publishes a GitHub Release.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Check the tag matches backend/version.py
        shell: pwsh
        run: |
          $v = (python -c "from backend.version import __version__; print(__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match backend/version.py ($v)" }

      - name: Tests
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the app and installer
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist\Memory-Setup-*.exe, dist\Memory-*-portable.zip).FullName
          gh release create "${{ github.ref_name }}" $files --title "Memory ${{ github.ref_name }}" --generate-notes
